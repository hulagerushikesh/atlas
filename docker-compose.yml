version: "3.9"

services:
  # ── Vector store ────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.15.4
    container_name: atlas_qdrant
    ports:
      - "6333:6333"   # REST + gRPC
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # Not curl: the qdrant image does not ship it (nor wget), so the old
      # `curl -f http://localhost:6333/readyz` could never run and the
      # container was permanently unhealthy -- which made `docker compose
      # up -d` fail outright, because `api` waits on service_healthy. The
      # service itself was fine the whole time. bash *is* in the image, so
      # the check speaks HTTP over /dev/tcp. Verified both ways: exit 0
      # against the running service, non-zero against a closed port.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: atlas_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Atlas API ────────────────────────────────────────────────────────────────
  atlas_api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atlas_api
    ports:
      - "${API_PORT:-8000}:8000"
    # The image defaults to 8010 (Cloud Run sets its own PORT); keep 8000 here.
    env_file: .env
    environment:
      PORT: "8000"
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
    restart: unless-stopped

volumes:
  qdrant_data:
  redis_data:

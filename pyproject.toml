[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlas"
version = "0.1.0"
description = "Production-grade agentic RAG platform for enterprise knowledge bases"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    # Required by FastAPI for multipart/form-data, which is how POST
    # /ingest/upload receives files. FastAPI raises at *request* time without
    # it, not at import, so an undeclared dependency here would be a 500 on
    # one route with a green suite everywhere else.
    "python-multipart>=0.0.9",

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",

    # Async
    "anyio>=4.4.0",

    # Document loaders
    "pypdf>=4.3.0",
    "beautifulsoup4>=4.12.3",
    "markdown-it-py>=3.0.0",

    # Embeddings & vector store
    "openai>=1.35.0",
    # >=1.10 for query_points; the old search() was removed in later 1.x.
    "qdrant-client>=1.10,<2.0",

    # Sparse retrieval
    "rank-bm25>=0.2.2",

    # Reranking
    # <6: 6.x fails to load the MiniLM cross-encoder tokenizer (2026-09-20).
    "sentence-transformers>=3.0.1,<6",
    "torch>=2.3.0",

    # Caching
    "redis>=5.0.6",

    # Auth / usage storage
    "aiosqlite>=0.20.0",

    # Observability
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",

    # Utilities
    "tenacity>=8.3.0",
    "numpy>=1.26.4",
    "xxhash>=3.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.9",
    "mypy>=1.10.0",
    "types-redis>=4.6.0",
    "rich>=13.7.1",
    "tabulate>=0.9.0",
    # The independent oracle for `atlas.evaluation.significance`: its exact
    # Wilcoxon p-values are checked against scipy's on tie-free input. Test
    # scope only — the comparator ships inside the API image and must not
    # pull scipy into it, which is also why the test is not simply a call to
    # scipy. It installs transitively under sentence-transformers today;
    # named here so the oracle cannot vanish because a reranker dropped it.
    "scipy>=1.11.0",
]
# Cloud Run deploy: Firestore-backed API keys (AUTH_STORE=firestore).
gcp = [
    "google-cloud-firestore>=2.16.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# -rs: a skipped test prints why. Three dataset guards skip without the
# fetched corpus, and "4 skipped" on its own looks like nothing happened.
# --cov-fail-under=90, against 93% today. A number the gate defends, not a
# number it prints: without it a commit can take coverage to 60% and `make
# test` still passes, which is the same failure shape as a pin that cannot
# fail. 90 and not 93 so that deleting a well-covered module -- which lowers
# the percentage without removing a single test -- is a conversation rather
# than a red build; raise it when the margin stops being used.
addopts = "--cov=atlas --cov-report=term-missing --cov-fail-under=90 -q -rs"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008 fires on `x = Depends(...)` in signature defaults, which is the intended
# FastAPI idiom rather than the mutable-default bug the rule targets.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# The router's few-shot examples live inside a prompt string. Reflowing them to
# satisfy line-length would change the text actually sent to the model.
"src/atlas/orchestration/router.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/atlas"]
omit = ["*/tests/*"]
